function stop(){if(phase!=='spinning')return;clearTimeout(autoTimer);cancelAnimationFrame(raf);phase='slowing';let opts=options(),chosen=Math.floor(Math.random()*opts.length),seg=Math.PI*2/opts.length;let normalized=((angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);let target=(2*Math.PI-chosen*seg)%(2*Math.PI);let delta=((target-normalized+2*Math.PI)%(2*Math.PI))+Math.PI*2*4;let from=angle,t0=performance.now(),duration=2100;render();function tick(now){if(phase!=='slowing')return;let p=Math.min(1,(now-t0)/duration);angle=from+delta*(1-Math.pow(1-p,4));draw();if(p<1)raf=requestAnimationFrame(tick);else{results[idx]=opts[chosen];phase='done';render();scheduleGeneration()}}raf=requestAnimationFrame(tick)}
function cancelSpin(){clearTimeout(autoTimer);cancelAnimationFrame(raf)}function action(){if(phase==='spinning')stop();else if(phase==='ready')start();else if(phase==='done')next()}
$('mainBtn').onclick=action;wheel.onclick=()=>{if(phase==='spinning')stop();else if(phase==='ready'&&!currentResult())start()};wheel.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();wheel.click()}};$('prev').onclick=()=>{if(idx>0){revisiting=true;idx--;sub=0;phase='done';angle=0;render()}};$('redo').onclick=()=>{if(confirm('重新抽選本題將清除本題與後續所有結果及故事，確定嗎？'))resetFromHere()};
function showOverview(){$('overview').classList.remove('hidden');$('overviewRecords').innerHTML=recordHTML();$('overviewStory').textContent=epicStory||stories.filter(Boolean).join('\n\n')||'尚未生成故事，可前往命運的書記官撰寫。';window.scrollTo({top:0,behavior:'smooth'})}
$('restart').onclick=()=>{cancelSpin();invalidateGeneration();results=Array(22).fill(null);stories=Array(22).fill(null);idx=0;sub=0;phase='ready';angle=0;$('overview').classList.add('hidden');epicStory='';storyMode='chapters';render()};
$('contract').onclick=()=>$('contractDialog').showModal();$('contract').onkeydown=e=>{if(e.key==='Enter')$('contract').click()};$('cancelContract').onclick=()=>$('contractDialog').close();$('confirmContract').onclick=()=>{$('contractDialog').close();$('contract').classList.add('hidden');$('scribe').classList.remove('hidden')};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id==='tab-'+b.dataset.tab))});
$('prompt').value=DEFAULT_PROMPT;$('resetPrompt').onclick=()=>{$('prompt').value=DEFAULT_PROMPT};$('savePreset').onclick=()=>{config.prompt=$('prompt').value;config.words=Math.max(80,Math.min(1500,+$('wordCount').value||280));alert('已套用生成偏好')};
function baseDefault(p){return p==='google'?'https://generativelanguage.googleapis.com/v1beta':p==='openai'?'https://api.openai.com/v1':''}
function connection(state,msg){$('connection').dataset.state=state;$('connectionText').textContent=msg}
function invalidateConnection(){apiVersion++;validatedVersion=-1;aiEnabled=false;models=[];$('model').innerHTML='<option value="">請先測試連線</option>';$('manualWrap').classList.add('hidden');connection('idle','尚未連線');$('apiError').textContent=''}
$('provider').onchange=()=>{config.provider=$('provider').value;$('baseUrl').value=baseDefault(config.provider);invalidateConnection()};$('baseUrl').value=baseDefault('openai');$('baseUrl').oninput=invalidateConnection;$('apiKey').oninput=invalidateConnection;$('model').onchange=()=>{validatedVersion=-1;aiEnabled=false;connection('idle','模型已變更，請重新驗證')};$('manualModel').oninput=()=>{validatedVersion=-1;aiEnabled=false};$('toggleKey').onclick=()=>{$('apiKey').type=$('apiKey').type==='password'?'text':'password'};
function getConfig(){let provider=$('provider').value,base=$('baseUrl').value.trim().replace(/\/+$/,''),key=$('apiKey').value.trim();if(!key)throw Error('請輸入 API Key');if(!/^https:\/\//.test(base)&&!/^http:\/\/localhost(?::\d+)?/.test(base))throw Error('請輸入有效的 HTTPS Base URL（localhost 可使用 HTTP）');return {provider,base,key}}
async function requestJSON(url,options={}){let controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);try{let r=await fetch(url,{...options,signal:options.signal||controller.signal});let raw=await r.text(),data;try{data=JSON.parse(raw)}catch{throw Error('API 回應不是有效 JSON（可能是端點錯誤或 CORS 問題）')}if(!r.ok)throw Error(data.error?.message||data.error?.status||`HTTP ${r.status}`);return data}catch(e){if(e instanceof TypeError)throw Error('網路或 CORS 連線失敗，請確認服務商是否允許瀏覽器直接呼叫');throw e}finally{clearTimeout(timeout)}}
function auth(c){return c.provider==='google'?{'x-goog-api-key':c.key}:{Authorization:`Bearer ${c.key}`}}
async function listModels(c){let url=c.provider==='google'?`${c.base}/models`:`${c.base}/models`;let data=await requestJSON(url,{headers:auth(c)});let list=data.models||data.data||[];return list.filter(m=>{if(c.provider==='google')return (m.supportedGenerationMethods||[]).includes('generateContent');return !/embedding|audio|whisper|tts|moderation|image|dall-e|realtime|transcribe|speech/i.test(m.id||'')}).map(m=>c.provider==='google'?m.name.replace(/^models\//,''):m.id).filter(Boolean).sort()}
$('testApi').onclick=async()=>{let version=apiVersion;connection('testing','正在測試連線…');$('apiError').textContent='';try{let c=getConfig();let list=await listModels(c);if(version!==apiVersion)return;models=list;$('model').innerHTML='<option value="">請選擇模型</option>'+list.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');$('manualWrap').classList.toggle('hidden',list.length>0);connection('success',list.length?`連線成功，取得 ${list.length} 個候選模型（尚待驗證生成）`:'連線成功，但未取得可用模型，請手動輸入');}catch(e){if(version!==apiVersion)return;connection('fail','連線失敗');$('apiError').textContent=e.message;$('manualWrap').classList.remove('hidden')}};
async function generate(c,model,messages,signal){if(c.provider==='google'){let contents=messages.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));let sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n');let data=await requestJSON(`${c.base}/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{...auth(c),'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents,generationConfig:{temperature:.85,maxOutputTokens:2048}}),signal});let text=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('');if(!text)throw Error('模型未回傳文字');return text}let data=await requestJSON(`${c.base}/chat/completions`,{method:'POST',headers:{...auth(c),'Content-Type':'application/json'},body:JSON.stringify({model,messages,temperature:.85,max_tokens:2048}),signal});let text=data.choices?.[0]?.message?.content;if(typeof text!=='string'||!text.trim())throw Error('模型未回傳文字，或不支援 Chat Completions');return text}
$('verifyModel').onclick=async()=>{let version=apiVersion;try{let c=getConfig(),model=$('model').value||$('manualModel').value.trim();if(!model)throw Error('請選擇或輸入模型');connection('testing','正在驗證模型文字生成…');await generate(c,model,[{role:'system',content:'只輸出 OK'},{role:'user',content:'回覆 OK'}]);if(version!==apiVersion)return;config={...config,...c,model};validatedVersion=version;aiEnabled=true;connection('success',`已驗證模型：${model}，AI 已啟用`);$('apiError').textContent='';scheduleGeneration()}catch(e){if(version!==apiVersion)return;connection('fail','模型驗證失敗');$('apiError').textContent=e.message}};
function invalidateGeneration(){runId++;if(requestController)requestController.abort();requestController=null;processing=false}
function renderStories(){let story=storyMode==='epic'?epicStory:stories.filter(Boolean).join('\n\n');$('storyContent').textContent=story||'尚未寫下任何故事。';$('generationStatus').textContent=processing?'書記官正在續寫…':!aiEnabled?'等待設定並啟用 API':stories.some(Boolean)?'已生成的篇章已保存':'等待命運揭曉'}
function scheduleGeneration(){if(!aiEnabled||processing)return;void processQueue()}
async function processQueue(){if(processing||!aiEnabled)return;processing=true;let myRun=runId;renderStories();try{for(let i=0;i<22;i++){if(myRun!==runId||!aiEnabled)break;let r=results[i];if(!r)break;if(stories[i])continue;let c={provider:config.provider,base:config.base,key:config.key};requestController=new AbortController();let history=results.slice(0,i+1).map((x,j)=>`${j+1}. ${QUESTIONS[j].label}：${recordValue(j)}`).join('\n');let previous=stories.slice(0,i).filter(Boolean).join('\n\n');let messages=[{role:'system',content:config.prompt},{role:'user',content:`目前已確定的命運設定：\n${history}\n\n前文：\n${previous.slice(-9000)||'（故事開始）'}\n\n請只為第 ${i+1} 題新增約 ${config.words} 字的小說段落，延續前文，不要重寫前文。`}];let text=await generate(c,config.model,messages,requestController.signal);if(myRun!==runId)break;stories[i]=text;renderStories()}}catch(e){if(myRun===runId){$('generationStatus').textContent='生成失敗';$('apiError').textContent=e.message;$('generationStatus').textContent=`生成失敗：${e.message}`}}finally{if(myRun===runId){processing=false;requestController=null;renderStories()}}}

const STYLE_NAMES=['日系 RPG 冒險','史詩奇幻','中韓式浪漫西幻','黑暗奇幻','現代魔法世界','都市超自然','蒸氣龐克'];
const STYLE_GUIDES=[
'節奏明快、冒險感強、角色互動活潑；以任務、夥伴、探索與成長推動情節，保持輕快幽默。',
'莊嚴宏大而細膩，重視古老歷史、地理、文化、漫長旅程與命運的重量；語言具有史詩韻律。',
'華麗細膩，重視人物心理、曖昧情感、宮廷禮儀、社交權力與人際張力，描寫優雅而有層次。',
'陰鬱、殘酷而神祕；聚焦道德困境、詛咒、代價、危機與生存，避免輕易圓滿的解答。',
'魔法與日常生活交織，重視學院氛圍、友情、探索、神祕事件與逐步揭露的祕密。',
'現代都市夜色、超自然懸疑與偵查，節奏俐落，重視隱藏於城市的異象與秘密勢力。',
'復古工業、黃銅齒輪、蒸汽機械與神祕學交織；突出發明、探索、陰謀與科技魔法衝突。'];
function stylePrompt(i){return `你是西方奇幻小說的命運書記官。請使用繁體中文、第二人稱「你」敘事。小說文風：${STYLE_NAMES[i]}。${STYLE_GUIDES[i]} 嚴格根據玩家抽中的所有設定寫作，不得自行更改結果。依照題目順序推進故事，保持人物、關係、事件與劇情前後連貫。第15題與第14題角色相連，第17題解釋第16題的尋找者，第19題解釋第18題的追殺者。逐題續寫時延續前文，不要每次重新從頭講述；第22題必須按照最終結局收尾。只輸出小說正文，不附加生成說明。`}
$('styleSelect').onchange=()=>{let nextPrompt=stylePrompt($('styleSelect').selectedIndex);if($('prompt').value!==config.prompt&&$('prompt').value!==stylePrompt(STYLE_NAMES.indexOf(config.style||STYLE_NAMES[0]))&&!confirm('切換文風會取代目前編輯的提示詞，確定嗎？')){$('styleSelect').value=config.style||STYLE_NAMES[0];return}$('prompt').value=nextPrompt;config.prompt=nextPrompt;config.style=$('styleSelect').value};
$('resetPrompt').onclick=()=>{$('prompt').value=stylePrompt($('styleSelect').selectedIndex)};
$('prompt').value=stylePrompt(0);config.prompt=$('prompt').value;config.style=STYLE_NAMES[0];
const oldTheme=theme;theme=function(){let before=document.body.dataset.world;oldTheme();let n=Number(document.body.dataset.world);if(document.body.dataset.world!=='initial'&&before!==document.body.dataset.world&&idx===0){let chosen=STYLE_NAMES[n];$('styleSelect').value=chosen;$('prompt').value=stylePrompt(n);config.prompt=$('prompt').value;config.style=chosen}};
function closeOverview(){$('overview').classList.add('hidden')}
$('closeOverview').onclick=closeOverview;
function lifeText(){return ['《穿進了西幻世界怎麼辦？》',...QUESTIONS.map((q,i)=>results[i]?`${q.label}：${recordValue(i)}`:null).filter(Boolean)].join('\n')}
async function copyText(value){try{await navigator.clipboard.writeText(value)}catch(e){let t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();document.execCommand('copy');t.remove()}alert('已複製')}
$('copyLife').onclick=()=>copyText(lifeText());
$('copyStory').onclick=()=>copyText(storyMode==='epic'?epicStory:stories.filter(Boolean).join('\n\n'));
$('viewChapters').onclick=()=>{storyMode='chapters';renderStories()};
$('viewEpic').onclick=()=>{storyMode='epic';renderStories()};
$('goScribe').onclick=()=>{closeOverview();if($('scribe').classList.contains('hidden'))$('contract').click();else document.querySelector('[data-tab="story"]').click();$('contract').parentElement.scrollIntoView({behavior:'smooth',block:'center'})};
$('writeEpic').onclick=async()=>{if(results.some(x=>!x)){alert('請先完成全部 22 題');return}if(!aiEnabled){document.querySelector('[data-tab="api"]').click();alert('請先驗證並啟用 API');return}if(epicBusy)return;epicBusy=true;let myRun=runId;let c={provider:config.provider,base:config.base,key:config.key};$('generationStatus').textContent='正在撰寫完整人生史詩…';try{let text=await generate(c,config.model,[{role:'system',content:config.prompt},{role:'user',content:`以下是全部22題人生設定：\n${lifeText()}\n請將它們融入一篇完整、有開端、發展、轉折與結局的西方奇幻小說，篇幅約${Math.max(1000,config.words*8)}字。保留所有設定與人物關係，只輸出小說正文。`}]);if(myRun===runId){epicStory=text;storyMode='epic';renderStories();$('generationStatus').textContent='完整人生史詩生成完成'}}catch(e){$('generationStatus').textContent='生成失敗：'+e.message}finally{epicBusy=false}};

$('retry').onclick=()=>{if(!aiEnabled){document.querySelector('[data-tab="api"]').click();return}invalidateGeneration();scheduleGeneration()};window.addEventListener('resize',resize);resize();render();
</script></body></html>
